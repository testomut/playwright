[project]
name = "python-playwright-qa-framework"
version = "1.0.0"
description = "Python Playwright QA framework: generic CRM page objects, API fixtures and offline checks"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.2",
    "pytest-playwright>=0.5",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "playwright>=1.45",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
report = ["allure-pytest>=2.13"]
dev = ["ruff>=0.5", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 200
addopts = "-ra --strict-markers"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-5s %(message)s"
log_cli_date_format = "%H:%M:%S"
markers = [
    "e2e: requires an explicitly configured disposable test environment",
    "free: free-tier account tests",
]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003 ищут "неоднозначные" юникод-символы. Здесь их два вида, и оба намеренные:
# кириллица в комментариях и типографские кавычки в ожидаемых строках приложения.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
